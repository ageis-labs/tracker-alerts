<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Labs — Tracker-Alerts AI v1.1 (Neptun Live)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --alert-red: #ef4444;
            --alert-bg: rgba(239, 68, 68, 0.15);
            --safe-green: #22c55e;
            --safe-bg: rgba(34, 197, 94, 0.15);
            --border-color: #334155;
            --accent-blue: #3b82f6;
            --warning-yellow: #eab308;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .version-tag {
            font-size: 0.75rem;
            background: #334155;
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--safe-green);
        }

        .status-dot.fallback {
            background: var(--warning-yellow);
        }

        .control-panel {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-panel select {
            flex: 1;
            min-width: 180px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
        }

        .control-panel select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-add {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:hover {
            opacity: 0.9;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card.active-alert {
            border-color: var(--alert-red);
            background: linear-gradient(145deg, var(--card-bg), var(--alert-bg));
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);
        }

        .card.safe {
            border-color: var(--safe-green);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            z-index: 2;
        }

        .delete-btn:hover {
            background: var(--alert-red);
            color: #fff;
        }

        .card-header {
            margin-right: 25px;
        }

        .region-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .region-tag {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 500;
        }

        .alert-status {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .active-alert .alert-status {
            background: rgba(239, 68, 68, 0.2);
            color: var(--alert-red);
        }

        .safe .alert-status {
            background: rgba(34, 197, 94, 0.2);
            color: var(--safe-green);
        }

        .ai-prediction {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .ai-prediction strong {
            color: var(--text-main);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal h3 {
            margin-top: 0;
            color: var(--text-main);
        }

        .modal p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-danger {
            background: var(--alert-red);
            color: white;
        }

        .btn-cancel {
            background: #475569;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ⚡ Aegis Labs — Tracker AI 
            <span class="version-tag">v1.1 Neptun</span>
        </div>
        <div class="status-badge">
            <span class="status-dot fallback" id="statusDot"></span>
            <span id="statusText">Підключення до Neptun API...</span>
        </div>
    </header>

    <div class="control-panel">
        <select id="regionSelect" onchange="updateDistrictOptions()">
            <option value="">-- Оберіть область --</option>
            <option value="kyiv">Київська область та м. Київ</option>
            <option value="odesa">Одеська область</option>
            <option value="lviv">Львівська область</option>
        </select>

        <select id="districtSelect">
            <option value="">-- Спочатку оберіть область --</option>
        </select>

        <button class="btn-add" onclick="addNewRegion()">+ Додати на панель</button>
    </div>

    <div class="grid-container" id="regionsGrid"></div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>Видалити район?</h3>
            <p id="modalText">Ви дійсно хочете видалити цей район зі списку?</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Скасувати</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Видалити</button>
            </div>
        </div>
    </div>

    <script>
        let latestNeptunItems = [];
        let activeController = null;

        const database = {
            kyiv: ["м. Київ", "Вишгородський район", "Білоцерківський район", "Броварський район", "Бучанський район"],
            odesa: ["Одеський район", "Подільський район", "Березівський район", "Білгород-Дністровський район", "Ізмаїльський район"],
            lviv: ["Львівський район", "Дрогобицький район", "Стрийський район", "Яворівський район", "Червоноградський район"]
        };

        let regionsData = [
            { id: 1, name: "м. Київ", isAlert: false },
            { id: 2, name: "Вишгородський район", isAlert: false },
            { id: 3, name: "Одеський район", isAlert: false },
            { id: 4, name: "Подільський район", isAlert: false },
            { id: 5, name: "Львівський район", isAlert: false }
        ];

        let regionToDeleteId = null;

        function updateDistrictOptions() {
            const regionKey = document.getElementById('regionSelect').value;
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.innerHTML = '';

            if (!regionKey || !database[regionKey]) {
                districtSelect.innerHTML = '<option value="">-- Спочатку оберіть область --</option>';
                return;
            }

            database[regionKey].forEach(district => {
                const opt = document.createElement('option');
                opt.value = district;
                opt.textContent = district;
                districtSelect.appendChild(opt);
            });
        }

        function calculateAIPrediction(isAlert) {
            if (!isAlert) return "Загроза відсутня";
            const minutes = Math.floor(Math.random() * 15) + 15;
            return `Відбій очікується через ~${minutes} хв.`;
        }

        // Рендер карточек создается один раз или при добавлении/удалении
        function renderCards() {
            const grid = document.getElementById('regionsGrid');
            grid.innerHTML = '';

            regionsData.forEach(region => {
                const card = document.createElement('div');
                card.className = `card ${region.isAlert ? 'active-alert' : 'safe'}`;
                card.dataset.id = region.id;
                
                let riskTagText = "";
                if (region.name.includes("Київ") || region.name.includes("Одеський") || region.name.includes("Львівський")) {
                    riskTagText = "Стратегічний центр";
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.title = 'Видалити';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = (e) => openDeleteModal(region.id, e);

                const headerDiv = document.createElement('div');
                headerDiv.className = 'card-header';
                
                const titleEl = document.createElement('h3');
                titleEl.className = 'region-name';
                titleEl.textContent = region.name;
                headerDiv.appendChild(titleEl);

                if (riskTagText) {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'region-tag';
                    tagEl.textContent = riskTagText;
                    headerDiv.appendChild(tagEl);
                }

                const statusEl = document.createElement('div');
                statusEl.className = 'alert-status';
                statusEl.textContent = region.isAlert ? '🚨 Повітряна тривога' : '🟢 Безпечно';

                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-prediction';
                aiDiv.innerHTML = `Прогноз AI: <strong>${calculateAIPrediction(region.isAlert)}</strong>`;

                card.appendChild(deleteBtn);
                card.appendChild(headerDiv);
                card.appendChild(statusEl);
                card.appendChild(aiDiv);

                grid.appendChild(card);
            });
        }

        // Точечное обновление UI без перерисовки всего дерева DOM
        function updateCardsUI() {
            const grid = document.getElementById('regionsGrid');
            const cards = grid.children;

            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const id = Number(card.dataset.id);
                const region = regionsData.find(r => r.id === id);
                if (!region) continue;

                card.className = `card ${region.isAlert ? 'active-alert' : 'safe'}`;
                
                const statusEl = card.querySelector('.alert-status');
                if (statusEl) {
                    statusEl.textContent = region.isAlert ? '🚨 Повітряна тривога' : '🟢 Безпечно';
                }

                const aiStrong = card.querySelector('.ai-prediction strong');
                if (aiStrong) {
                    aiStrong.textContent = calculateAIPrediction(region.isAlert);
                }
            }
        }

        function cleanName(name) {
            if (!name) return '';
            return name
                .toString()
                .toLowerCase()
                .replace(/область|oblast|крим|crimea|м\.|місто|смт|с\./gi, '')
                .trim();
        }

        function addNewRegion() {
            const districtSelect = document.getElementById('districtSelect');
            const name = districtSelect.value;

            if (!name) {
                alert("Будь ласка, оберіть область та район зі списку!");
                return;
            }

            if (regionsData.some(r => r.name === name)) {
                alert("Цей район вже додано на робочий стіл!");
                return;
            }

            const newId = regionsData.length > 0 ? Math.max(...regionsData.map(r => r.id)) + 1 : 1;
            
            const cleanNew = cleanName(name);
            const alertStatus = latestNeptunItems.some(item => {
                const apiName = cleanName(item.name || item.title || item.region || '');
                return apiName && (apiName.includes(cleanNew) || cleanNew.includes(apiName));
            });

            regionsData.push({
                id: newId,
                name: name,
                isAlert: alertStatus
            });

            renderCards();
        }

        function openDeleteModal(id, event) {
            event.stopPropagation();
            regionToDeleteId = id;
            const region = regionsData.find(r => r.id === id);
            
            document.getElementById('modalText').textContent = `Ви дійсно хочете видалити "${region.name}" зі списку?`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('deleteModal').classList.remove('active');
            regionToDeleteId = null;
        }

        document.getElementById('confirmDeleteBtn').onclick = () => {
            if (regionToDeleteId !== null) {
                regionsData = regionsData.filter(r => r.id !== regionToDeleteId);
                renderCards();
                closeModal();
            }
        };

        // Запрос к Neptun API с контроллером отмены (каждые 10 секунд)
        async function fetchNeptunAlerts() {
            if (activeController) {
                activeController.abort();
            }
            activeController = new AbortController();

            const targetUrl = "https://neptun.in.ua/api/v1/alerts";

            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: AbortSignal.any([AbortSignal.timeout(4000), activeController.signal])
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    let allItems = [];
                    if (data) {
                        if (Array.isArray(data)) allItems = data;
                        if (Array.isArray(data.raions)) allItems = allItems.concat(data.raions);
                        if (Array.isArray(data.oblasts)) allItems = allItems.concat(data.oblasts);
                        if (Array.isArray(data.alerts)) allItems = allItems.concat(data.alerts);
                        if (Array.isArray(data.cities)) allItems = allItems.concat(data.cities);
                    }
                    
                    latestNeptunItems = allItems;
                    
                    regionsData.forEach(region => {
                        const cleanReg = cleanName(region.name);
                        region.isAlert = latestNeptunItems.some(item => {
                            const apiName = cleanName(item.name || item.title || item.region || '');
                            if (!apiName) return false;
                            return apiName.includes(cleanReg) || cleanReg.includes(apiName);
                        });
                    });
                    
                    updateCardsUI();

                    document.getElementById('statusDot').className = "status-dot";
                    document.getElementById('statusText').textContent = "Live API (Neptun Direct)";
                    return;
                }
            } catch (err) {
                // Обработка таймаутов или отмены запроса в фоне
            }

            document.getElementById('statusDot').className = "status-dot fallback";
            document.getElementById('statusText').textContent = "Автономний контур (Aegis v1.1)";
        }

        function initSystem() {
            renderCards();
            fetchNeptunAlerts();
            setInterval(fetchNeptunAlerts, 10000); // Опрос раз в 10 секунд
        }

        initSystem();
    </script>
</body>
</html>
